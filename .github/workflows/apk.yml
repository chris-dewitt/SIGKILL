name: APK

# A playable build, on demand, without a local Android toolchain.
#
# `ci.yml` proves the game is correct; it cannot tell anybody whether it is
# any good to hold. That needs a phone, and a phone needs an APK, and an APK
# that depends on one laptop having Android Studio installed is a build that
# does not exist on the days that laptop is busy. So it is built here.
on:
  # The button in the Actions tab. Works from a phone browser.
  workflow_dispatch:

  # Every merge leaves a build attached to the commit that produced it, so
  # "does this feel right" is never blocked on setting up a toolchain first.
  #
  # A `v*` tag does that *and* publishes the APK as a Release asset, which is
  # the only form of it a phone can download without being signed in. That is
  # deliberately a thing you do rather than a thing that happens: see the
  # `release` job.
  push:
    branches: [main]
    tags: ['v*']

  # Nothing else in CI compiles the Android project, so a change to the
  # wrapper has to prove itself before it lands.
  pull_request:
    paths:
      - '.github/workflows/apk.yml'
      - 'apps/terminal/android/**'
      - 'apps/terminal/capacitor.config.ts'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Capacitor 7 and AGP 8.7 both want a 21 toolchain.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install
        run: pnpm install --frozen-lockfile

      # The runner image already ships the SDK, so this uses its own
      # `sdkmanager` rather than a third-party action. One fewer moving part in
      # the supply chain of a build that gets installed on a phone.
      - name: Android SDK packages
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build the web app
        run: pnpm build

      - name: Copy it into the Android project
        run: pnpm --filter @sigkill/terminal exec cap sync android

      # Also in `ci.yml`. It runs again here because this is the job whose
      # output ends up on a device, and a guard is cheap.
      - name: Check the manifest
        run: pnpm --filter @sigkill/terminal check:android

      - name: Assemble the debug APK
        working-directory: apps/terminal/android
        run: ./gradlew assembleDebug --no-daemon

      # An unsigned release package, which is what would go to a store once
      # a key is attached. Nothing else in CI compiles the release variant, and
      # the permission assertion below has to be made against it rather than
      # against the debug build.
      - name: Assemble the unsigned release APK
        working-directory: apps/terminal/android
        run: ./gradlew assembleRelease --no-daemon

      # Neither package may ask the operating system for anything.
      #
      # `check:android` reads the manifest in the repository, which cannot see
      # what Capacitor, AGP and every library manifest add on the way to a
      # package. This reads the packages themselves, with `aapt2`, after the
      # merge -- the only place the answer is not a guess.
      #
      # It reads the *package* rather than grepping the merged manifest XML for
      # a second reason: that manifest keeps its comments, and this project's
      # manifest documents the removed INTERNET permission by quoting it. A
      # grep of the XML matches its own explanation and reports a permission
      # that is not there. `check-manifest.mjs` strips comments first for
      # exactly that reason; `aapt2` reads compiled resources and cannot be
      # fooled by prose at all.
      #
      # The one entry allowed is androidx.core's
      # `<applicationId>.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION`, a
      # signature-level permission the app defines for itself so its own
      # dynamic receivers are not exported. It grants nothing outside the app.
      - name: Neither package may ask for anything
        run: |
          aapt2="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          out=apps/terminal/android/app/build/outputs/apk
          status=0
          for apk in "$out/debug/app-debug.apk" "$out/release/app-release-unsigned.apk"; do
            test -f "$apk" || { echo "missing: $apk"; exit 1; }
            echo
            ls -l "$apk"
            "$aapt2" dump badging "$apk" |
              grep -E '^(package:|sdkVersion:|targetSdkVersion:|application-label:)'
            asked=$("$aapt2" dump permissions "$apk" |
              grep '^uses-permission' |
              grep -v 'DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION' || true)
            if [ -n "$asked" ]; then
              echo "  this package asks for:"
              echo "$asked"
              status=1
            else
              echo "  asks for nothing"
            fi
          done
          if [ "$status" -ne 0 ]; then
            echo
            echo 'SIGKILL ships entirely offline and asks for nothing.'
            echo 'See docs/ANDROID.md.'
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          # The head commit, not `github.sha`: on a pull_request event that is
          # the ephemeral merge commit, and an artifact named after a commit
          # that is on no branch cannot be matched to the build it came from.
          name: sigkill-debug-${{ github.event.pull_request.head.sha || github.sha }}
          path: apps/terminal/android/app/build/outputs/apk/debug/app-debug.apk
          # Long enough to play, short enough not to accumulate. Note that
          # this repository is public, and so are its build artifacts.
          retention-days: 14
          if-no-files-found: error

  # ------------------------------------------------------------------------
  # Publishing, on a tag and only on a tag.
  #
  # An Actions artifact is an authenticated zip. A phone browser that is not
  # signed in gets a 404 rather than a login prompt, which makes the artifact
  # route useless for the one device the game is built for. A Release asset is
  # a plain direct link: tap it and Android installs.
  #
  # The cost is that this repository is public, so the asset is a public
  # download -- a working build, one tap, for anybody with the link. That is
  # why it is not on every merge. It happens when you tag one.
  #
  #     git tag v0.1.0-playtest && git push origin v0.1.0-playtest
  #
  # The build job above stays `contents: read`. Only this job can write, it
  # runs no build step of its own, and it publishes exactly the package that
  # job already produced and checked.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: debug-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: sigkill-debug-${{ github.sha }}

      # `gh` ships on the runner and authenticates with the job's own token,
      # so publishing needs no third-party action and no stored credential.
      #
      # The tag arrives through `env`, never interpolated into the script.
      # `${{ }}` is substituted into the text of the run block before bash ever
      # parses it, and a tag may legally be named `v$(...)` or ``v`...` `` --
      # `git check-ref-format` accepts both. Interpolated, pushing such a tag
      # would run its own name as shell, in the one job here that holds
      # `contents: write` and a token. An environment variable is data: bash
      # expands `"$TAG"` to the characters it holds and stops there.
      - name: Publish the tagged build
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Defence in depth, not the fix above: a tag shaped like nothing we
          # would ever cut fails loudly rather than publishing a release named
          # after it, and never reaches a filename either.
          if ! printf '%s' "$TAG" | grep -qE '^v[0-9][0-9A-Za-z._-]*$'; then
            echo "refusing to publish from a tag named '$TAG'"
            exit 1
          fi

          apk="sigkill-$TAG.apk"
          mv app-debug.apk "$apk"
          ls -l "$apk"
          gh release create "$TAG" "$apk" \
            --title "SIGKILL $TAG" \
            --prerelease \
            --notes "$(cat <<'NOTES'
          A playtest build. Not the Play release.

          Download the `.apk` below on an Android phone and tap it. Android
          asks once for permission to install from whatever app you opened it
          with; that grant is per-source, not global.

          This is a **debug** package: `debuggable`, unoptimised and signed
          with a throwaway key, which is right for your own device and wrong
          for handing out. It is the same package CI builds on every merge.

          It runs entirely offline. It requests no permissions at all -- every
          build is checked for that with `aapt2`, on both this package and the
          release variant, and the run fails if either asks the operating
          system for anything. Airplane mode changes nothing about it.

          `docs/PLAYTEST.md` has the checklist worth walking.
          NOTES
          )"
          echo
          gh release view "$TAG" --json url,assets \
            --jq '.url, (.assets[] | "\(.name)  \(.size) bytes  \(.url)")'
