<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#05080600" />
    <title>SIGKILL</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23050806'/%3E%3Crect x='3' y='7' width='2' height='2' fill='%236ee7a0'/%3E%3Crect x='6' y='7' width='7' height='2' fill='%233e7f5c'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="crt">
      <!--
        Just a host for the canvas. The live region lives inside, created by
        TerminalView alongside the canvas it mirrors -- two nested log regions
        would announce everything twice.
      -->
      <div id="stage">
        <div id="screen"></div>
        <div id="scroll-rail" aria-hidden="true"><div id="scroll-thumb"></div></div>
      </div>
      <div id="dock">
        <!--
          TEXT sits here rather than on the prompt row. At 400px that row is
          already prompt + field + TAB, and a second button there left the
          field about six characters wide -- paying for a control used once a
          session with the one that is used every keystroke.
        -->
        <div id="chip-row">
          <div id="chips" role="toolbar" aria-label="Command suggestions"></div>
          <button type="button" id="text" aria-label="Select and copy text">TEXT</button>
        </div>
        <div id="symbols" role="toolbar" aria-label="Symbol keys"></div>
        <form id="line" autocomplete="off">
          <label for="input" id="prompt"></label>
          <input
            id="input"
            name="input"
            type="text"
            autocapitalize="none"
            autocorrect="off"
            autocomplete="off"
            spellcheck="false"
            enterkeyhint="send"
            aria-label="Command input"
          />
          <button type="button" id="tab" aria-label="Complete">TAB</button>
        </form>
      </div>

      <!--
        Select mode.

        The scrollback is a canvas behind a shader that bends it, so there is
        no honest way to lay selectable text over the picture: barrel
        distortion moves every glyph away from where the DOM would put it, and
        worst at the edges. This is the same text without the tube in front of
        it -- a plain element the platform can select, with the platform's own
        handles and its own Copy.
      -->
      <div id="text-view" role="dialog" aria-modal="true" aria-label="Transcript" hidden>
        <div id="text-bar">
          <span id="text-title">TRANSCRIPT</span>
          <button type="button" id="text-copy">COPY ALL</button>
          <button type="button" id="text-done">DONE</button>
        </div>
        <pre id="text-body" tabindex="0"></pre>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
